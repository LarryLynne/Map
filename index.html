<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMS: Логістична Карта</title>
    
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p id="loader-text">Завантаження карти та вузлів...</p>
    </div>

    <!-- ПАНЕЛЬ КЕРУВАННЯ -->
    <div id="filter-panel">
        <h3>TMS Маршрутизатор</h3>
        
        <label>Старт (Вузол):</label>
        <select id="start-node"><option value="">Оберіть старт...</option></select>
        
        <label>Фініш (Вузол):</label>
        <select id="end-node"><option value="">Оберіть фініш...</option></select>

        <div class="toggle-container">
            <input type="checkbox" id="toggle-infra" checked>
            <label for="toggle-infra" style="display: inline; margin: 0; font-weight: bold; cursor: pointer;">Відображати інфраструктуру</label>
        </div>

        <label>Інфраструктура на шляху:</label>
        <select id="type-select">
            <option value="all">Всі об'єкти</option>
            <option value="road_bridge">Автомобільні мости</option>
            <option value="rail_bridge">Залізничні мости</option>
            <option value="auto_crossing">Залізничні переїзди</option>
        </select>
        
        <div id="route-stats" style="display: none; margin-bottom: 15px; padding: 10px; background: #e9ecef; border-radius: 4px;">
            <div style="font-size: 13px; margin-bottom: 5px; color: #555;">Базовий шлях: <b id="dist-base">0</b> км</div>
            <div style="font-size: 13px; color: #333;">Поточний (з об'їздом): <b id="dist-actual" style="color: #e32636; font-size: 15px;">0</b> км</div>
        </div>

        <button onclick="calculateRoute()" class="btn-primary">Побудувати маршрут</button>
        <button onclick="clearRoute()" class="btn-danger">Скинути</button>
        
        <p class="hint">ℹ️ Правий клік по карті — додати точку об'їзду.</p>
    </div>

    <div id="top-right-stats">
        <h4>Статистика об'єктів</h4>
        <ul id="stats-list">
            <li>Всього на екрані: <span id="stat-total">0</span></li>
            <li>Автомобільні мости: <span id="stat-road">0</span></li>
            <li>Залізничні мости: <span id="stat-rail">0</span></li>
            <li>Залізничні переїзди: <span id="stat-cross">0</span></li>
        </ul>
    </div>

    <div id="map"></div>

    <script src="app.js"></script>
</body>
</html>
